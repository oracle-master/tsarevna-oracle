<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>-= ЦАРЕВНА-ОРАКУЛ =-</title>
    <style>
        /* ---------- ЛОКАЛЬНЫЙ ШРИФТ ---------- */
        @font-face {
            font-family: 'Volshebstvo';
            src: url('TDVolshebstvo.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #010003;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Times New Roman', 'Georgia', serif;
            padding: 20px 20px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 35% 25%, #060212 0%, #010003 100%);
            z-index: -3;
        }

        .nebula-one {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 15% 30%, rgba(60, 30, 120, 0.1) 0%, transparent 45%);
            z-index: -2;
            animation: nebulaMove 45s infinite alternate;
        }

        .nebula-two {
            position: fixed; bottom: 0; right: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 85% 70%, rgba(20, 40, 100, 0.06) 0%, transparent 55%);
            z-index: -2;
            animation: nebulaMove 55s infinite alternate-reverse;
        }

        @keyframes nebulaMove {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(1.06); }
        }

        .stars-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }

        .star {
            position: absolute;
            background: #e8dcff;
            border-radius: 50%;
            opacity: 0;
            animation: starTwinkle 3.5s infinite ease-in-out;
            box-shadow: 0 0 8px #b8a0e0;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.6); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* ----- ЗАГОЛОВОК ----- */
        .main-title {
            font-family: 'Volshebstvo', 'Times New Roman', serif;
            font-weight: 400;
            font-size: 52px;
            letter-spacing: 6px;
            text-transform: none;
            margin-bottom: 20px;
            margin-top: 10px;
            background: linear-gradient(135deg,
                    #d0c8e0 0%, #f0e8ff 25%, #c0b8d8 40%, #f8f4ff 55%, #b8aed0 70%, #a098c0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(210, 200, 240, 0.7), 0 0 50px rgba(190, 180, 220, 0.5),
                0 4px 10px rgba(0, 0, 0, 0.6);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
            word-spacing: 8px;
            text-align: center;
            line-height: 1.1;
        }

        @media (max-width: 400px) {
            .main-title { font-size: 34px; letter-spacing: 3px; word-spacing: 4px; }
        }

        .princess-mirror {
            max-width: 380px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Овальная рамка */
        .mirror-frame {
            position: relative;
            width: 85%;
            aspect-ratio: 1 / 1.15;
            background: radial-gradient(ellipse at 50% 45%, rgba(30, 20, 50, 0.6) 0%, rgba(8, 5, 25, 0.85) 90%);
            border-radius: 50% / 40%;
            box-shadow:
                0 0 0 4px rgba(190, 180, 210, 0.6),
                0 0 0 10px rgba(15, 10, 30, 0.9),
                0 0 0 14px rgba(160, 150, 190, 0.5),
                0 0 50px rgba(180, 170, 210, 0.6),
                0 0 80px rgba(140, 130, 180, 0.4),
                inset 0 0 30px rgba(230, 220, 255, 0.25),
                inset 0 0 80px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            animation: gentleFloat 8s infinite ease-in-out;
            overflow: hidden;
        }

        .mirror-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 20% 30%, rgba(230, 220, 255, 0.35) 1px, transparent 1px),
                radial-gradient(circle at 80% 60%, rgba(210, 200, 240, 0.3) 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, rgba(190, 180, 220, 0.25) 1px, transparent 1px);
            background-size: 60px 60px, 80px 80px, 70px 70px;
            opacity: 0.6;
            z-index: 2;
            pointer-events: none;
            animation: dustFloat 20s infinite linear;
        }

        @keyframes dustFloat {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: -60px 60px, 80px -40px, -70px -30px; }
        }

        .mirror-frame::after {
            content: '';
            position: absolute;
            top: -5%; left: -10%;
            width: 50%; height: 30%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            transform: rotate(-15deg);
            z-index: 3;
            pointer-events: none;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        .princess-face {
            position: relative;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: inherit;
            z-index: 1;
        }

        .princess-face img {
            position: absolute;
            max-width: 98%; max-height: 98%;
            object-fit: contain;
            transition: opacity 0.18s ease;
            border-radius: inherit;
            filter: drop-shadow(0 0 12px rgba(230, 220, 255, 0.7));
        }

        .eyes-closed { z-index: 2; opacity: 1; }
        .eyes-open { z-index: 1; opacity: 0; }
        .glasses { z-index: 3; opacity: 0; }

        @keyframes krutishka {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        .spin { animation: krutishka 0.8s ease-in-out; }

        /* Экран ответа */
        .mirror-answer {
            background: rgba(5, 3, 20, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 18px 12px;
            width: 100%;
            border: 1px solid rgba(200, 190, 220, 0.5);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.7), 0 0 30px rgba(180, 170, 210, 0.5);
            margin-bottom: 16px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #answer-text {
            color: #f4f0ff;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 15px #c8b8e8, 0 0 6px #ffffff;
            line-height: 1.3;
            transition: color 0.3s, text-shadow 0.3s;
            font-style: italic;
            word-break: break-word;
            padding: 4px 0;
        }

        #answer-text.positive {
            color: #fae7b3;
            text-shadow: 0 0 20px #d4af37, 0 0 6px #fff5e6;
        }
        #answer-text.neutral {
            color: #e0e8f0;
            text-shadow: 0 0 20px #b0c8e8, 0 0 6px #ffffff;
        }
        #answer-text.negative {
            color: #f0e0f8;
            text-shadow: 0 0 20px #c8a8e0, 0 0 6px #ffffff;
        }

        .ornament-divider {
            text-align: center;
            font-size: 18px;
            letter-spacing: 10px;
            color: #c0b0d8;
            text-shadow: 0 0 8px #a898c8;
            margin-top: -8px;
            margin-bottom: 12px;
        }

        .ritual-panel {
            background: rgba(5, 3, 12, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(190, 180, 210, 0.35);
            border-radius: 30px;
            padding: 8px 10px;
            margin-bottom: 14px;
            box-shadow: 0 0 20px rgba(40, 30, 70, 0.3);
        }

        .steps-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .step-row {
            color: #d8d0e8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0.85;
        }

        .step-bullet {
            font-size: 14px;
            color: #b8a8d0;
            text-shadow: 0 0 8px #a098c0;
        }

        .portal-status {
            color: #c8bce0;
            font-size: 13px;
            min-height: 28px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 400;
            text-shadow: 0 0 10px #a898c8;
        }

        .counter-text {
            color: #a098b8;
            font-size: 11px;
            letter-spacing: 3px;
            margin-top: 8px;
            text-transform: uppercase;
            text-align: center;
            opacity: 0.8;
        }

        .flash-answer {
            animation: crystalAnswer 0.7s ease-out;
        }

        @keyframes crystalAnswer {
            0% { text-shadow: 0 0 8px #ffffff; }
            30% { text-shadow: 0 0 40px #e0d0f8, 0 0 70px #c8b8e8, 0 0 15px #ffffff; }
            100% { text-shadow: 0 0 15px #c8b8e8, 0 0 6px #ffffff; }
        }

        .warning-nfc { display: none; }
    </style>
</head>
<body>
    <div class="nebula-one"></div>
    <div class="nebula-two"></div>
    <div class="stars-layer" id="starsLayer"></div>

    <div class="main-title">Царевна-Оракул</div>

    <div class="princess-mirror">
        <div class="mirror-frame" id="mirrorFrame">
            <div class="princess-face">
                <img src="https://i.imgur.com/Xobf8jG.png" class="eyes-closed" alt="Царевна слушает">
                <img src="https://i.imgur.com/CPEQSf9.png" class="eyes-open" alt="Царевна">
                <img src="https://i.imgur.com/sobpNvm.png" class="glasses" alt="Царевна знает">
            </div>
        </div>

        <div class="ornament-divider">❧ ✿ ❧</div>

        <div class="mirror-answer">
            <div id="answer-text">Приложи талисман,<br>чтобы загадать</div>
        </div>

        <div class="ritual-panel">
            <div class="steps-column">
                <div class="step-row">
                    <span class="step-bullet">•</span>
                    <span>ЗАГАДАЙ ЖЕЛАНИЕ</span>
                </div>
                <div class="step-row">
                    <span class="step-bullet">•</span>
                    <span>ВСТРЕТЬСЯ ВЗГЛЯДОМ</span>
                </div>
                <div class="step-row">
                    <span class="step-bullet">•</span>
                    <span>ПРИЛОЖИ ТАЛИСМАН</span>
                </div>
            </div>
        </div>

        <div class="portal-status" id="portalStatus">Царевна ждёт...</div>

        <div class="counter-text">
            <span id="counterDisplay">0</span> <span id="counterLabel">предсказаний</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // Генерация звёзд
            function generateStars() {
                const layer = document.getElementById('starsLayer');
                for (let i = 0; i < 130; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const size = Math.random() * 2.2 + 0.7;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 6 + 's';
                    star.style.animationDuration = (Math.random() * 3.5 + 2.5) + 's';
                    layer.appendChild(star);
                }
            }
            generateStars();

            // Ответы
            const positive = [
                "Быть по-твоему", "Звёзды шепчут: да", "Добрый знак", "Суженое сбудется",
                "Сама судьба — за", "Удача в кокошнике", "Верь, и придёт", "Знаки добрые",
                "Так тому и быть", "Перст судьбы", "Путь открыт", "Свет впереди",
                "Истинно", "Не сомневайся", "Решено свыше"
            ];
            const neutral = [
                "Туман над рекой", "Спроси у ветра", "Монетка на ребре", "Всё в твоих руках",
                "Подожди до рассвета", "Пока неясно", "Судьба играет в прятки", "Переменчиво",
                "Ни да, ни нет", "Зеркало молчит", "Повремени", "Думы в разброде",
                "Загадай иначе", "Тайна под замком", "Равновесие"
            ];
            const negative = [
                "Не в этот раз", "Звёзды хмурятся", "Обойди стороной", "Не сейчас",
                "Путь закрыт", "Ложная надежда", "Препятствия впереди", "Не стоит",
                "Отступись", "Иллюзия", "Холодный ветер", "Забудь",
                "Не судьба", "Ответ — нет", "Погасшая искра"
            ];

            const positiveSet = new Set(positive);
            const neutralSet = new Set(neutral);
            const allAnswers = [...positive, ...neutral, ...negative];

            const answerElement = document.getElementById('answer-text');
            const portalStatus = document.getElementById('portalStatus');
            const counterSpan = document.getElementById('counterDisplay');
            const counterLabel = document.getElementById('counterLabel');
            const mirrorFrame = document.getElementById('mirrorFrame');
            const imgClosed = document.querySelector('.eyes-closed');
            const imgOpen = document.querySelector('.eyes-open');
            const imgGlasses = document.querySelector('.glasses');

            let revelationCount = 0;
            try {
                const saved = localStorage.getItem('crystal_oracle_count');
                if (saved) revelationCount = parseInt(saved, 10) || 0;
            } catch (e) {}

            function updateCounter() {
                counterSpan.textContent = revelationCount;
                const n = revelationCount % 10;
                const m = revelationCount % 100;
                if (m >= 11 && m <= 14) {
                    counterLabel.textContent = 'предсказаний';
                } else if (n === 1) {
                    counterLabel.textContent = 'предсказание';
                } else if (n >= 2 && n <= 4) {
                    counterLabel.textContent = 'предсказания';
                } else {
                    counterLabel.textContent = 'предсказаний';
                }
                try { localStorage.setItem('crystal_oracle_count', revelationCount); } catch (e) {}
            }
            updateCounter();

            let step = 0; // 0 — ждём загадывания, 1 — загадано
            let scanCooldown = false;
            let blinkInterval;

            function setEyes(state) {
                imgClosed.style.opacity = (state === 'closed') ? '1' : '0';
                imgOpen.style.opacity = (state === 'open') ? '1' : '0';
                imgGlasses.style.opacity = (state === 'glasses') ? '1' : '0';
            }

            function startBlinking() {
                if (blinkInterval) clearInterval(blinkInterval);
                blinkInterval = setInterval(() => {
                    if (imgGlasses.style.opacity === '1') return;
                    imgOpen.style.opacity = '1';
                    imgClosed.style.opacity = '0';
                    setTimeout(() => {
                        imgOpen.style.opacity = '0';
                        imgClosed.style.opacity = '1';
                    }, 150);
                }, 3500);
            }

            function stopBlinking() {
                if (blinkInterval) { clearInterval(blinkInterval); blinkInterval = null; }
                imgOpen.style.opacity = '0';
                imgClosed.style.opacity = '1';
            }

            function showGlassesTemporarily() {
                stopBlinking();
                setEyes('glasses');
                setTimeout(() => {
                    setEyes('closed');
                    startBlinking();
                }, 2000);
            }

            function triggerKrutishka() {
                mirrorFrame.classList.add('spin');
                setTimeout(() => mirrorFrame.classList.remove('spin'), 800);
            }

            function playMagicSound() {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = audioCtx.currentTime;
                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(1400, now);
                    osc1.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                    gain1.gain.setValueAtTime(0.3, now);
                    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc1.connect(gain1);
                    gain1.connect(audioCtx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.6);

                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(1800, now);
                    osc2.frequency.exponentialRampToValueAtTime(1000, now + 0.5);
                    gain2.gain.setValueAtTime(0.15, now);
                    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(now);
                    osc2.stop(now + 0.7);
                } catch (e) {}
            }

            function deliverProphecy() {
                revelationCount++;
                updateCounter();

                const prophecy = allAnswers[Math.floor(Math.random() * allAnswers.length)];
                answerElement.classList.remove('positive', 'neutral', 'negative');
                if (positiveSet.has(prophecy)) {
                    answerElement.classList.add('positive');
                } else if (neutralSet.has(prophecy)) {
                    answerElement.classList.add('neutral');
                } else {
                    answerElement.classList.add('negative');
                }

                answerElement.style.opacity = '0.2';
                setTimeout(() => {
                    answerElement.textContent = prophecy;
                    answerElement.style.opacity = '1';
                    answerElement.classList.add('flash-answer');
                    setTimeout(() => answerElement.classList.remove('flash-answer'), 700);
                }, 70);

                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(35);
                }
                showGlassesTemporarily();
                triggerKrutishka();
                playMagicSound();
            }

            function setWaitingForWish() {
                step = 0;
                setEyes('closed');
                startBlinking();
                answerElement.innerHTML = 'Приложи талисман,<br>чтобы загадать';
                answerElement.classList.remove('positive', 'neutral', 'negative');
                portalStatus.textContent = 'Царевна ждёт...';
            }

            function setWishReady() {
                step = 1;
                setEyes('open');
                stopBlinking();
                answerElement.textContent = 'Загадывай желание';
                answerElement.classList.remove('positive', 'neutral', 'negative');
                portalStatus.textContent = 'Царевна слушает...';
            }

            function onTagScanned() {
                if (scanCooldown) return;
                scanCooldown = true;
                if (step === 0) {
                    setWishReady();
                } else {
                    deliverProphecy();
                    setWaitingForWish();
                }
                setTimeout(() => { scanCooldown = false; }, 2500);
            }

            // Инициализация NFC
            if (!('NDEFReader' in window)) {
                portalStatus.textContent = 'Царевна дремлет';
                setWaitingForWish();
            } else {
                let ndefReader = null;
                async function autoStartScan() {
                    try {
                        ndefReader = new NDEFReader();
                        setWaitingForWish();
                        await ndefReader.scan();
                        portalStatus.textContent = 'Приложите талисман';
                        ndefReader.onreading = () => {
                            onTagScanned();
                        };
                        ndefReader.onreadingerror = () => {
                            portalStatus.textContent = 'Не распознано...';
                        };
                    } catch (error) {
                        portalStatus.textContent = 'Царевна задумалась...';
                        setWaitingForWish();
                    }
                }
                autoStartScan();
            }
        })();
    </script>
</body>
</html>
